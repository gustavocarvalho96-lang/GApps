<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protótipo — Alergia rápida</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --line:#d9e2ec; --teal:#0f766e; --soft:#ecfdf8; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; background:#eef2f6; color:var(--ink); font-family:Inter,Segoe UI,Arial,sans-serif; }
    .page { width:min(1050px,calc(100% - 32px)); margin:36px auto; }
    .note { margin:0 0 12px; color:var(--muted); font-size:13px; font-weight:650; }
    .card { min-height:680px; border:1px solid #dce4ef; border-radius:18px; background:#fff; padding:24px; box-shadow:0 16px 40px rgba(15,23,42,.08); }
    h1 { margin:0; font-size:22px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 14px; }
    button { min-height:38px; border:1px solid #cbd5e1; border-radius:9px; background:#fff; color:#344054; padding:8px 12px; font-weight:780; cursor:pointer; }
    button:hover { border-color:#94a3b8; background:#f8fafc; }
    .allergy-wrap { position:relative; }
    .allergy-trigger { display:flex; align-items:center; gap:7px; }
    .allergy-trigger.active { border-color:rgba(15,118,110,.4); background:var(--soft); color:var(--teal); }
    .count { display:none; min-width:20px; height:20px; place-items:center; border-radius:99px; background:var(--teal); color:#fff; font-size:11px; }
    .allergy-trigger.active .count { display:grid; }
    .popover { position:absolute; z-index:2; top:46px; left:0; width:430px; border:1px solid var(--line); border-radius:14px; background:#fff; padding:14px; box-shadow:0 18px 46px rgba(15,23,42,.18); }
    .hidden { display:none; }
    .search-row { display:flex; gap:8px; }
    input { width:100%; min-height:42px; border:1px solid #b9c6d5; border-radius:10px; padding:9px 12px; outline:none; font-size:14px; }
    input:focus { border-color:var(--teal); box-shadow:0 0 0 4px rgba(15,118,110,.11); }
    .add { border-color:var(--teal); background:var(--teal); color:#fff; }
    .hint { margin:7px 2px 12px; color:var(--muted); font-size:11px; }
    .label { margin:11px 0 7px; color:#475467; font-size:11px; font-weight:850; text-transform:uppercase; letter-spacing:.05em; }
    .chips { display:flex; flex-wrap:wrap; gap:7px; }
    .chip { min-height:31px; border-radius:99px; padding:5px 10px; font-size:12px; }
    .chip.selected { border-color:rgba(15,118,110,.35); background:var(--soft); color:var(--teal); }
    .negative { width:100%; margin-top:13px; border-color:#b7dfd9; background:#f4fbf9; color:var(--teal); }
    .selected-line { display:flex; align-items:center; flex-wrap:wrap; gap:8px; min-height:42px; margin-bottom:12px; }
    .selected-line .empty { color:#98a2b3; font-size:13px; }
    .tag { display:inline-flex; align-items:center; gap:7px; border:1px solid #f1b9b5; border-radius:99px; background:#fff5f4; color:#912018; padding:6px 9px 6px 11px; font-size:12px; font-weight:750; }
    .tag button { min-height:0; border:0; background:transparent; color:var(--danger); padding:0; font-size:16px; line-height:1; }
    textarea { width:100%; min-height:420px; resize:vertical; border:1px solid var(--line); border-radius:12px; padding:16px; color:#263349; outline:none; font:14px/1.6 Consolas,monospace; }
    .suggestions { display:grid; gap:4px; margin-top:8px; }
    .suggestion { width:100%; text-align:left; border:0; background:#f8fafc; }
    @media (max-width:600px) { .popover { position:fixed; inset:auto 12px 12px; width:auto; } }
  </style>
</head>
<body>
  <main class="page">
    <p class="note">Protótipo isolado — nenhuma alteração no aplicativo</p>
    <section class="card">
      <h1>Anamnese</h1>
      <div class="actions">
        <button>Limpar template</button><button>Masculino</button><button>Feminino</button>
        <button>Padrão</button><button>Sinais vitais</button><button>Oto/Oro</button><button>Psiq</button>
        <div class="allergy-wrap">
          <button id="trigger" class="allergy-trigger active" aria-expanded="true">Alergia <span id="count" class="count">2</span> <span>⌄</span></button>
          <div id="popover" class="popover">
            <div class="search-row">
              <input id="search" autocomplete="off" placeholder="Digite: dipi, amox, contraste…">
              <button id="add" class="add">Adicionar</button>
            </div>
            <div class="hint">Enter adiciona · Esc fecha · aceita qualquer texto</div>
            <div id="suggestions" class="suggestions"></div>
            <div class="label">Mais usadas</div>
            <div id="quick" class="chips"></div>
            <button id="negative" class="negative">✓ Nega alergias medicamentosas</button>
          </div>
        </div>
        <button>Atestado</button><button>Pré Tramal</button>
      </div>
      <div class="label">Registradas</div>
      <div id="selected" class="selected-line"></div>
      <textarea id="editor"># HMA:
Paciente refere sintomas há 2 dias.

--> Alergia : Dipirona | Amoxicilina

# Exame físico:
BEG, corado, hidratado.</textarea>
    </section>
  </main>
  <script>
    const medicines = ["Dipirona","Amoxicilina","Ibuprofeno","Penicilina","AINEs","Cefalosporinas","Contraste iodado","Tramadol","Diclofenaco","Azitromicina"];
    let selected = ["Dipirona","Amoxicilina"];
    const $ = id => document.getElementById(id);
    function syncText() {
      const line = selected.length ? selected.join(" | ") : "";
      $("editor").value = $("editor").value.replace(/(-->\s*Alergia\s*:\s*).*/i, "$1" + line);
    }
    function render() {
      $("count").textContent = selected.length;
      $("trigger").classList.toggle("active", selected.length > 0);
      $("selected").innerHTML = selected.length ? "" : '<span class="empty">Nenhuma alergia registrada</span>';
      selected.forEach(name => {
        const tag = document.createElement("span"); tag.className = "tag";
        tag.innerHTML = `<span>${name}</span><button title="Remover ${name}">×</button>`;
        tag.querySelector("button").onclick = () => { selected = selected.filter(x => x !== name); syncText(); render(); };
        $("selected").appendChild(tag);
      });
      $("quick").innerHTML = "";
      ["Dipirona","AINEs","Penicilina","Amoxicilina","Cefalosporinas","Contraste iodado"].forEach(name => {
        const b = document.createElement("button"); b.className = "chip" + (selected.includes(name) ? " selected" : ""); b.textContent = name;
        b.onclick = () => { selected = selected.includes(name) ? selected.filter(x => x !== name) : [...selected,name]; syncText(); render(); };
        $("quick").appendChild(b);
      });
    }
    function suggestions() {
      const term = $("search").value.trim().toLowerCase();
      $("suggestions").innerHTML = "";
      if (!term) return;
      medicines.filter(x => x.toLowerCase().includes(term) && !selected.includes(x)).slice(0,3).forEach(name => {
        const b = document.createElement("button"); b.className = "suggestion"; b.textContent = name;
        b.onclick = () => add(name); $("suggestions").appendChild(b);
      });
    }
    function add(value) {
      const name = (value || $("search").value).trim();
      if (name && !selected.includes(name)) selected.push(name);
      $("search").value = ""; $("suggestions").innerHTML = ""; syncText(); render(); $("search").focus();
    }
    $("trigger").onclick = () => { $("popover").classList.toggle("hidden"); $("trigger").setAttribute("aria-expanded", !$("popover").classList.contains("hidden")); if (!$("popover").classList.contains("hidden")) $("search").focus(); };
    $("search").oninput = suggestions;
    $("search").onkeydown = e => { if (e.key === "Enter") { const first = $("suggestions").querySelector("button"); add(first ? first.textContent : ""); } if (e.key === "Escape") $("trigger").click(); };
    $("add").onclick = () => add();
    $("negative").onclick = () => { selected = []; syncText(); $("editor").value = $("editor").value.replace(/(-->\s*Alergia\s*:\s*).*/i, "$1Nega alergias medicamentosas"); render(); };
    render();
    $("search").focus();
  </script>
</body>
</html>
